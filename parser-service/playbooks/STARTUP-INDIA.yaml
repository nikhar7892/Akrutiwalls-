# DPIIT Startup India Recognition Certificate. Recognition numbers carry a
# DIPP prefix (e.g. DIPP12345). Used to claim Section 80-IAC tax exemption
# and Angel Tax exemption (Section 56).
form: STARTUP-INDIA
description: DPIIT Startup India Recognition Certificate

match:
  text_contains_any:
    - "Certificate of Recognition"
    - "DPIIT"
    - "DIPP"
    - "Department for Promotion of Industry"
    - "Startup India"

regex:
  - field: company.dpiitNumber
    pattern: '\b(DIPP\d{4,7})\b'
    transform: upper
    confidence: 0.98
  - field: company.name
    pattern: '(?:Name of (?:the\s+)?(?:Entity|Startup|Company))\s*[:\-]\s*([A-Z][A-Z0-9 .,&\-]{2,})'
    confidence: 0.85
  - field: company.dateOfIncorporation
    pattern: '(?:Date of Incorporation|Date of Registration of Entity)\s*[:\-]?\s*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.9
  - field: filing.filedOn
    pattern: '(?:Date of Recognition|Recognition Date)\s*[:\-]?\s*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.9
  - field: company.businessNature
    pattern: '(?:Sector|Industry|Industry Sector)\s*[:\-]\s*([A-Za-z ,/\-]+)'
    confidence: 0.7

defaults:
  filing.form: "DPIIT"
  filing.purpose: "Startup India recognition"

writes_to:
  - entity: Company
    fields: [dpiitNumber, name, dateOfIncorporation, businessNature]
    requires: [dpiitNumber]
    transforms:
      dateOfIncorporation: date
  - entity: Filing
    fields: [form, purpose, filedOn]
    requires: [form]
