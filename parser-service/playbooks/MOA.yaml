# Memorandum of Association. Six clauses (Name, Office State, Objects,
# Liability, Capital, Subscribers). Rules grab the capital + name; the objects
# clause and subscriber table are noisy and best handed to Haiku later.
form: MOA
description: Memorandum of Association (constitutional document)

match:
  text_contains:
    - "Memorandum of Association"
  text_contains_any:
    - "subscriber"
    - "Name Clause"
    - "Capital Clause"
    - "share capital of the company"

regex:
  # Clause I — Name. Usually appears as "1. The name of the company is ..."
  - field: company.name
    pattern: '(?:name of the (?:company|Company) is|"Name of the Company")\s*[:"]?\s*([A-Z][A-Z0-9 .,&\-]+(?:PRIVATE\s+LIMITED|LIMITED|LLP))'
    confidence: 0.85

  # Clause II — Registered office state. "The registered office of the company will be situated in the State of <X>"
  - field: address.state
    pattern: '(?:registered office.*?situated in.*?State of|State of)\s+([A-Z][A-Za-z ]+?)(?:\.|,|\n)'
    confidence: 0.7

  # Clause V — Capital. "The share capital of the company is Rs. X divided into Y shares of Rs. Z each"
  - field: capital.authorizedAmount
    pattern: '(?:share capital.*?is|authori[sz]ed (?:share )?capital.*?(?:is|of))\s*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)'
    transform: number
    confidence: 0.85
  - field: capital.authorizedShares
    pattern: 'divided into\s*([\d,]+)\s*(?:equity\s*)?shares?\s*of'
    transform: int
    confidence: 0.85
  - field: capital.faceValue
    pattern: 'shares?\s*of\s*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)\s*(?:each|/\-?\s*each)'
    transform: number
    confidence: 0.85

defaults:
  capital.changeReason: "INITIAL"
  capital.paidUpAmount: "0"   # subscribed amount; user edits in review

writes_to:
  - entity: Company
    fields: [name]
    requires: [name]
  - entity: Address
    fields: [type, state]
    requires: []
  - entity: CapitalHistory
    fields: [authorizedAmount, authorizedShares, faceValue, paidUpAmount, changeReason, effectiveFrom]
    requires: [authorizedAmount]

llm:
  system: |
    You are reading the Memorandum of Association of an Indian Private Limited
    company. Extract only the fields requested below from the clause headings.
    Do NOT make anything up — return null if a clause isn't visible in the snippet.
  fields:
    company.objectsClause:
      description: "Brief one-line summary of the main objects of the company (clause III)."
    company.businessNature:
      description: "Two-or-three-word business nature inferred from the objects clause (e.g. 'computer programming and IT consultancy')."
