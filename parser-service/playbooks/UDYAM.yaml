# Udyam Registration Certificate (MSME). 19-character format
# UDYAM-XX-00-0000000. Categorises enterprises as Micro / Small / Medium
# and embeds NIC codes + PAN + GSTIN of the entity.
form: UDYAM
description: Udyam (MSME) Registration Certificate

match:
  text_contains:
    - "Udyam Registration"
  text_contains_any:
    - "UDYAM"
    - "MSME"
    - "Ministry of Micro, Small and Medium Enterprises"

regex:
  - field: company.udyamNumber
    pattern: '\b(UDYAM-[A-Z]{2}-\d{2}-\d{7})\b'
    transform: upper
    confidence: 0.98
  - field: company.name
    pattern: '(?:Name of Enterprise|Enterprise Name|Name of Unit)\s*[:\-]\s*([A-Z][A-Z0-9 .,&\-]{2,})'
    confidence: 0.85
  - field: company.pan
    pattern: '\b([A-Z]{5}\d{4}[A-Z])\b'
    transform: upper
    confidence: 0.9
  - field: company.gstin
    pattern: '\b(\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z]\d)\b'
    transform: upper
    confidence: 0.9
  - field: company.msmeClassification
    pattern: '(?:Type of Enterprise|Enterprise Type|Classification)\s*[:\-]?\s*(Micro|Small|Medium)'
    transform: upper
    confidence: 0.95
  - field: company.mainNicCode
    pattern: '(?:NIC (?:Code|2[\-\s]?digit))\s*[:\-]?\s*(\d{2,5})'
    confidence: 0.8
  - field: filing.filedOn
    pattern: '(?:Date of (?:Registration|Issue|Incorporation of Enterprise))\s*[:\-]?\s*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.85

defaults:
  filing.form: "UDYAM"
  filing.purpose: "MSME / Udyam registration"

writes_to:
  - entity: Company
    fields: [udyamNumber, name, pan, gstin, mainNicCode]
    requires: [udyamNumber]
  - entity: Filing
    fields: [form, purpose, filedOn]
    requires: [form]
