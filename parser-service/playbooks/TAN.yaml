# TAN allotment letter. Format: 4 letters + 5 digits + 1 letter (e.g. BLRP12345D).
form: TAN
description: TAN (Tax Deduction Account Number) allotment letter

match:
  text_contains_any:
    - "Tax Deduction Account Number"
    - "TAN"
    - "TDS"

regex:
  - field: company.tan
    pattern: '\b([A-Z]{4}\d{5}[A-Z])\b'
    transform: upper
    confidence: 0.98
  - field: company.name
    pattern: '(?:Name of (?:Deductor|Assessee|Entity))\s*[:\-]\s*([A-Z][A-Z0-9 .,&\-]{2,})'
    confidence: 0.6

writes_to:
  - entity: Company
    fields: [tan, name]
    requires: [tan]
