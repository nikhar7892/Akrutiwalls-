# DIR-12 — Particulars of appointment/cessation of directors & KMP.
form: DIR-12
description: Appointment, cessation, or change in designation of directors & KMP

match:
  text_contains:
    - "Form No. DIR-12"
    - "DIR-12"
  text_contains_any:
    - "Particulars of appointment of directors"
    - "appointment of directors"
    - "Director Identification Number"

acroform:
  CIN: company.cin
  CompanyName: company.name
  DIN: director.din
  FirstName: director.firstName
  LastName: director.lastName
  FullName: director.name
  PAN: director.pan
  Designation: directorship.designation
  AppointmentDate: directorship.appointmentDate
  DateOfAppointment: directorship.appointmentDate
  CessationDate: directorship.cessationDate
  DateOfCessation: directorship.cessationDate
  Email: director.email
  Phone: director.phone
  Nationality: director.nationality

regex:
  - field: filing.srn
    pattern: 'SRN[\s:]+([A-Z]\d{8})'
    confidence: 0.95
  - field: filing.amountPaid
    pattern: '(?:Fee[s]?\s+Paid|Amount\s+Paid|Total\s+Fee[s]?|Fee[s]?)[\s:]*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)'
    transform: number
    confidence: 0.9
  - field: director.din
    pattern: 'DIN[\s:]+(\d{8})'
    confidence: 0.95
  - field: filing.filedOn
    pattern: '(?:Filed|Date of filing)[\s:on]*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.9

defaults:
  filing.form: "DIR-12"
  filing.purpose: "Director appointment / cessation"
  filing.status: "FILED"
  director.nationality: "Indian"

writes_to:
  - entity: Director
    fields: [din, name, pan, email, phone, nationality]
    requires: [din, name]
  - entity: Directorship
    fields: [designation, appointmentDate, cessationDate]
    requires: [designation, appointmentDate]
    transforms:
      appointmentDate: date
      cessationDate: date
  - entity: Filing
    fields: [form, srn, amountPaid, filedOn, purpose, status]
    requires: [form]

llm:
  # If form is non-standard / scanned, ask Haiku for the gist as fallback.
  system: |
    You are reading an MCA DIR-12 filing for an Indian Private Limited company.
    Extract any director identification details from the snippet.
  fields:
    filing.purpose:
      description: "One short sentence describing what this DIR-12 effected (appointment, resignation, change of designation)."
