# PAN card / allotment letter. Single identifier. Handles both individual
# (Father's name + DOB) and company (Date of incorporation) cases.
form: PAN
description: PAN card or allotment letter

match:
  text_contains_any:
    - "Permanent Account Number"
    - "Income Tax Department"
    - "PAN"
    - "INCOME TAX"

regex:
  - field: company.pan
    pattern: '\b([A-Z]{5}\d{4}[A-Z])\b'
    transform: upper
    confidence: 0.98
  - field: company.name
    pattern: '(?:Name|Name of (?:Assessee|Entity|Cardholder))\s*[:\-]\s*([A-Z][A-Z0-9 .,&\-]{2,})'
    confidence: 0.6
  - field: company.dateOfIncorporation
    pattern: '(?:Date of (?:Birth|Incorporation|Allotment))\s*[:\-]?\s*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.8

writes_to:
  - entity: Company
    fields: [pan, name, dateOfIncorporation]
    requires: [pan]
    transforms:
      dateOfIncorporation: date
