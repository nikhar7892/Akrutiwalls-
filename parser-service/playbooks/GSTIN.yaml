# GST Registration Certificate (Form GST REG-06). 15-digit GSTIN format:
# 2 digits state + 10-char PAN + 1 entity digit + 1 Z + 1 check digit.
form: GSTIN
description: GST registration certificate (Form GST REG-06)

match:
  text_contains_any:
    - "Form GST REG-06"
    - "GST REG-06"
    - "Registration Certificate"
    - "Goods and Services Tax"
  text_contains:
    - "GSTIN"

acroform:
  GSTIN: company.gstin
  LegalName: company.name
  TradeName: company.tradeName
  PAN: company.pan
  ConstitutionOfBusiness: company.constitution
  PrincipalPlaceOfBusiness: address.line1
  DateOfLiability: filing.effectiveFrom
  DateOfIssue: filing.filedOn

regex:
  - field: company.gstin
    pattern: '\b(\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z]\d)\b'
    transform: upper
    confidence: 0.98
  - field: company.name
    pattern: '(?:Legal Name|Name of (?:business|the registered person))\s*[:\-]\s*([A-Z][A-Z0-9 .,&\-]{2,})'
    confidence: 0.85
  - field: company.pan
    pattern: '\b([A-Z]{5}\d{4}[A-Z])\b'
    transform: upper
    confidence: 0.9
  - field: filing.effectiveFrom
    pattern: '(?:Date of Liability|Effective Date)\s*[:\-]?\s*(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})'
    transform: date
    confidence: 0.85

defaults:
  filing.form: "GST REG-06"
  filing.purpose: "GST Registration"

writes_to:
  - entity: Company
    fields: [gstin, name, pan]
    requires: [gstin]
  - entity: Filing
    fields: [form, purpose, filedOn]
    requires: [form]
