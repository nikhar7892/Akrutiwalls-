# Articles of Association. Varies a lot between companies. Rules try to pull
# the basics: name, whether Table F is adopted, restated authorised capital,
# directors-count limits. Everything else (transfer restrictions, drag/tag-along,
# tie-breaking) is free-text legal prose, best handed to the Ask Anything tool.
form: AOA
description: Articles of Association

match:
  text_contains:
    - "Articles of Association"
  text_contains_any:
    - "Table F"
    - "Regulations of the Company"
    - "Interpretation"
    - "Regulations contained in"

regex:
  - field: company.name
    pattern: '(?:Articles of Association of|Company name)\s*[:\-]?\s*([A-Z][A-Z0-9 .,&\-]+(?:PRIVATE\s+LIMITED|LIMITED|LLP))'
    confidence: 0.85

  # Table F adoption — almost every Pvt Ltd AOA references this.
  - field: company.aoaType
    pattern: '(?:regulations contained in (?:Table\s*F|Schedule\s*I)[^\n.]{0,80}shall\s+apply)'
    confidence: 0.85
  - field: company.tableFAdopted
    pattern: '(?:Table\s*F[^\n.]{0,40}(?:apply|adopted|incorporated))'
    confidence: 0.9

  # Restated authorised capital — usually appears in the Share Capital article.
  - field: capital.authorizedAmount
    pattern: '(?:Authori[sz]ed\s+(?:Share\s+)?Capital(?:\s+of\s+the\s+Company)?(?:\s+is)?)\s*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)'
    transform: number
    confidence: 0.8
  - field: capital.faceValue
    pattern: 'shares?\s*of\s*(?:Rs\.?|₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)\s*each'
    transform: number
    confidence: 0.75

  # Board composition — many AOAs set min/max directors.
  - field: governance.minDirectors
    pattern: '(?:[Mm]inimum)\s+number\s+of\s+[Dd]irectors[^0-9\n]{0,40}([2-9]|1[0-5])'
    transform: int
    confidence: 0.8
  - field: governance.maxDirectors
    pattern: '(?:[Mm]aximum)\s+number\s+of\s+[Dd]irectors[^0-9\n]{0,40}(\d{1,2})'
    transform: int
    confidence: 0.8
  - field: governance.quorum
    pattern: '(?:quorum)[^0-9\n]{0,60}(\d{1,2})\s*(?:members|directors)'
    transform: int
    confidence: 0.75

  # Share classes referenced in the AOA.
  - field: governance.hasPreferenceShares
    pattern: '(?:preference\s+shares?)'
    confidence: 0.7
  - field: governance.hasCCPS
    pattern: '(?:compulsorily\s+convertible\s+preference|CCPS)'
    confidence: 0.7

writes_to:
  - entity: Company
    fields: [name]
    requires: []

llm:
  system: |
    You are reading the Articles of Association of an Indian Private Limited
    company. Classify it (Table F as-is vs modified vs custom drafting) and
    flag anything an auditor / CA should know about.
  fields:
    company.aoaType:
      description: "One of: TABLE_F (adopts Table F verbatim), MODIFIED_TABLE_F (adopts with edits), CUSTOM (full bespoke)."
    company.aoaNotes:
      description: "Two-sentence summary of any unusual articles — share-transfer restrictions, drag-along, tag-along, board-composition rights, dispute-resolution carveouts, etc. Return null if standard Table F."
